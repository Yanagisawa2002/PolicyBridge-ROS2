mock_manipulator:
  ros__parameters:
    publish_rate_hz: 20.0
    motion_rate_hz: 50.0
    max_delta_per_step: 0.02
    joint_names:
      [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    initial_positions: [0.5, -0.4, 0.3, -0.2, 0.1, -0.5]
    goal_tolerance: 0.005

mock_rgb_camera:
  ros__parameters:
    publish_rate_hz: 20.0
    width: 64
    height: 48
    frame_id: camera_rgb_optical_frame
    topic_name: /camera/rgb/image_raw

policy_server:
  ros__parameters:
    action_name: execute_policy
    joint_state_topic: /joint_states
    joint_command_topic: /joint_command
    image_topic: /camera/rgb/image_raw
    observation_mode: rgb_joint
    policy_backend: multimodal_scripted
    inference_timeout_seconds: 1.0
    joint_state_timeout_seconds: 1.0
    image_timeout_seconds: 1.0
    synchronized_observation_timeout_seconds: 1.0
    sync_queue_size: 10
    sync_slop_seconds: 0.05
    max_image_pixels: 2073600
    diagnostics_rate_hz: 1.0
    delayed_policy_delay_seconds: 2.0
    delayed_policy_first_call_only: true
    control_rate_hz: 10.0
    goal_tolerance: 0.005
    joint_names:
      [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]

demo_client:
  ros__parameters:
    action_name: execute_policy
    instruction: move to home
    max_steps: 200
    timeout_seconds: 0.0
